name: Plugins recomendados (espejo)

# Baja la última versión de cada plugin recomendado, saca sus VST3 de Windows
# y de Linux y los publica con nombre fijo en la Release «plugins» de este
# repositorio, junto a plugins.json (lo que lee MiRadio para instalar y
# actualizar). LSP no publica versión de Windows: se compila aquí desde su
# código fuente. Se ejecuta cada semana y a mano desde Actions.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      list_only:
        description: "Solo listar los archivos de cada proyecto (diagnóstico)"
        type: boolean
        default: false

jobs:
  lsp-windows:
    if: ${{ !inputs.list_only }}
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make git tar
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-binutils

      - name: Código fuente de la última versión
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $rel = gh api repos/lsp-plugins/lsp-plugins/releases/latest | ConvertFrom-Json
          $src = $rel.assets | Where-Object { $_.name -like 'lsp-plugins-src-*.tar.gz' } | Select-Object -First 1
          Invoke-WebRequest $src.browser_download_url -OutFile lsp-src.tar.gz
          "LSP_VERSION=$($rel.tag_name)" | Out-File -Append $env:GITHUB_ENV

      - name: Compilar LSP (VST3)
        run: |
          mkdir src && tar -xzf lsp-src.tar.gz -C src --strip-components=1
          cd src
          # Todo enlazado dentro (sin libwinpthread/libstdc++ de MinGW, que no
          # existen en un Windows normal).
          export LDFLAGS_EXT="-static -static-libgcc -static-libstdc++"
          export LDFLAGS="$LDFLAGS_EXT"
          make config FEATURES='vst3 ui' PREFIX=/opt/lsp LDFLAGS_EXT="$LDFLAGS_EXT"
          make -j4
          make install DESTDIR="$PWD/../dest"
          cd ..
          mkdir -p built/lsp-windows
          find dest -type d -name '*.vst3' -prune -exec cp -r {} built/lsp-windows/ \;
          ls -la built/lsp-windows
          # Comprobación: solo DLL del sistema
          for f in $(find built/lsp-windows -type f -iname '*.vst3'); do
            deps=$(objdump -p "$f" | grep "DLL Name" | grep -iE "libwinpthread|libstdc|libgcc|libssp" || true)
            if [ -n "$deps" ]; then echo "::error::$f depende de MinGW: $deps"; exit 1; fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: lsp-windows
          path: built/lsp-windows

  mirror:
    needs: lsp-windows
    # Si LSP no compila, el resto se publica igual (LSP queda sin Windows).
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: LSP compilado para Windows
        if: ${{ needs.lsp-windows.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: lsp-windows
          path: built/lsp-windows

      - name: Herramientas
        run: sudo apt-get install -y --no-install-recommends p7zip-full msitools >/dev/null

      - name: Preparar los plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIST_ONLY: ${{ inputs.list_only && '1' || '' }}
        run: python3 scripts/plugins/mirror.py out

      - name: Publicar en la Release «plugins»
        if: ${{ !inputs.list_only }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view plugins >/dev/null 2>&1; then
            gh release create plugins --title "Plugins recomendados" --latest=false \
              --notes "VST3 de código abierto preparados para MiRadio (se actualizan cada semana). No es una versión de MiRadio."
          fi
          gh release upload plugins out/* --clobber
