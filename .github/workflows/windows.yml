name: Compilar OmniCaster (Windows y Linux)

# Publicar una versión:
#   1. Sube la versión en package.json, src-tauri/Cargo.toml y
#      src-tauri/tauri.conf.json (las tres iguales).
#   2. git tag vX.Y.Z && git push origin vX.Y.Z
# Alternativa sin git local: Actions > "Run workflow" con "publicar" activado.
#
# Se crea la Release como borrador, se compila Windows (.exe NSIS y .msi) y
# después Linux (.AppImage y .deb); cada uno sube sus paquetes, sus firmas y
# su parte de latest.json (lo que leen las apps para actualizarse). Al final
# la Release se publica: hasta entonces las apps siguen viendo la anterior.
# Windows y Linux van uno detrás de otro para que latest.json no se pise.
#
# Con "Run workflow" sin "publicar" solo compila y guarda los paquetes como
# artefactos de la ejecución, sin publicar nada.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publicar una Release con la versión de tauri.conf.json"
        type: boolean
        default: false
      platform:
        description: "Qué compilar (también al publicar: «windows» publica solo Windows)"
        type: choice
        options: [todo, windows, linux]
        default: todo

jobs:
  create-release:
    if: github.ref_type == 'tag' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      - name: Crear la Release (borrador)
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$REF_TYPE" = "tag" ]; then
            if [ "${REF_NAME#v}" != "$version" ]; then
              echo "::error::La etiqueta $REF_NAME no coincide con la versión $version de tauri.conf.json"
              exit 1
            fi
            tag="$REF_NAME"
          else
            tag="v$version"
          fi
          # Si ya existe (un intento anterior), se reutiliza.
          id=$(gh api "repos/${{ github.repository }}/releases?per_page=30" --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -n1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/${{ github.repository }}/releases" \
              -f tag_name="$tag" -f target_commitish="${{ github.sha }}" \
              -f name="OmniCaster $tag" -F draft=true --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: create-release
    if: ${{ !failure() && !cancelled() && inputs.platform != 'linux' }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar la clave de firma de actualizaciones
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            Write-Error "Falta el secreto TAURI_SIGNING_PRIVATE_KEY (Settings > Secrets and variables > Actions). Sin él no se pueden firmar las actualizaciones."
            exit 1
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      # Opcional: compila ffmpeg-ndi.exe y lo incluye en el instalador.
      # Actívalo creando la variable de repositorio BUILD_NDI=true.
      # El FFmpeg con NDI usa --enable-nonfree; revisa las licencias antes
      # de publicar la Release.
      - name: Compilar FFmpeg con NDI
        if: vars.BUILD_NDI == 'true'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build-ffmpeg-ndi.ps1

      - name: Compilar instaladores (.exe y .msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma de las actualizaciones (clave de `tauri signer generate`).
          # Si la clave no tiene contraseña, el segundo secreto no hace falta.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          # latest.json apunta al instalador NSIS: se instala por usuario, sin
          # permisos de administrador, igual que la instalación actual.
          updaterJsonPreferNsis: true
          args: --bundles nsis,msi

      - name: Guardar los paquetes de la ejecución manual
        if: github.ref_type != 'tag' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: OmniCaster-windows
          path: |
            src-tauri/target/release/bundle/nsis/*
            src-tauri/target/release/bundle/msi/*

  build-linux:
    needs: [create-release, build-windows]
    if: ${{ !failure() && !cancelled() && inputs.platform != 'windows' }}
    # 22.04: el AppImage funciona también en sistemas más nuevos (Debian 12, Ubuntu 24.04…).
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # apt en pasos separados, con límite de tiempo y, si falla, las últimas
      # líneas como aviso (se ven en el resumen de la ejecución).
      - name: Librerías del sistema (lista de paquetes)
        timeout-minutes: 6
        run: |
          set -o pipefail
          # El espejo de Azure va a veces lentísimo: se usa el oficial de Ubuntu.
          # Los runners usan «mirror+file:/etc/apt/apt-mirrors.txt» con Azure primero.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          grep -rh "^deb\|^URIs" /etc/apt/sources.list /etc/apt/sources.list.d/ 2>/dev/null | head -3 || true
          if ! timeout 300 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update >apt.log 2>&1; then
            tail -n 15 apt.log | sed 's/^/::error::/'; exit 1
          fi

      - name: Librerías del sistema (Tauri)
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # man-db reindexa las paginas de manual al instalar: puede tardar minutos
          sudo rm -f /var/lib/man-db/auto-update
          if ! timeout -k 15 1080 sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold \
              install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
              librsvg2-dev patchelf libxdo-dev libasound2-dev libxcb1-dev libx11-xcb-dev libxcb-shm0-dev \
              libxcb-render0-dev libssl-dev file </dev/null >apt.log 2>&1; then
            tail -n 15 apt.log | sed 's/^/::error::/'; exit 1
          fi

      - name: Librerías del sistema (códecs para el AppImage)
        timeout-minutes: 20
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ! timeout -k 15 1080 sudo -E apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 \
              -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold \
              install -y --no-install-recommends gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
              gstreamer1.0-plugins-bad gstreamer1.0-libav </dev/null >apt.log 2>&1; then
            tail -n 15 apt.log | sed 's/^/::error::/'; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar paquetes (.AppImage y .deb)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --bundles appimage,deb

      - name: Guardar los paquetes de la ejecución manual
        if: github.ref_type != 'tag' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: OmniCaster-linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  publish:
    needs: [create-release, build-windows, build-linux]
    # Con «linux» no se compila Windows: basta con que salga bien Linux.
    if: ${{ needs.create-release.result == 'success' && !cancelled() && (needs.build-windows.result == 'success' || (inputs.platform == 'linux' && needs.build-linux.result == 'success')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publicar la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Si Linux falló, se publica igual con lo de Windows (se avisa).
          if [ "${{ needs.build-linux.result }}" != "success" ]; then
            echo "::warning::La compilación de Linux falló: la Release sale solo con Windows."
          fi
          gh api -X PATCH "repos/${{ github.repository }}/releases/${{ needs.create-release.outputs.release_id }}" \
            -F draft=false -f make_latest=true --jq .html_url
