[package]
name = "miradio"
version = "1.1.12"
description = "Estudio de automatizacion de radio: biblioteca por bloques, piloto automatico y crossfade"
authors = ["MiRadio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "miradio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Required for production builds: embeds the interface from ../dist.
# Do NOT force it on for `tauri dev`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "wav", "ogg", "pcm", "alac", "mkv"] }
ebur128-stream = "0.2"
ureq = "2"
rubato = "0.16"
cpal = "0.16"
rtrb = "0.3"
tiny_http = "0.12"
sha2 = "0.10"
unicode-normalization = "0.1"
base64 = "0.22"
form_urlencoded = "1"
percent-encoding = "2"
# Paquetes de plugins (zip, tar.gz y tar.xz)
flate2 = "1"
tar = "0.4"
lzma-rs = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }
libloading = "0.8"
jpeg-encoder = "0.6"
# Monitor del sistema (CPU, memoria, red, procesos): solo lo que se pide
sysinfo = { version = "0.33", default-features = false, features = ["system", "network", "disk"] }
# Plugins VST3 en canales y buses (en el propio proceso, sin el ayudante aislado)
vst3-host = { version = "0.10", default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# Una sola instancia: abrir MiRadio otra vez trae al frente la que ya esta abierta
tauri-plugin-single-instance = "2"

# Linux (X11): ventana a capturar por su título y pared del ratón.
[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2"

# El JPEG de la vista NDI se codifica en cada fotograma: siempre optimizado.
[profile.release.package.jpeg-encoder]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
