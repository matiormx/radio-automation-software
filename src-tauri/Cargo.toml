[package]
name = "miradio"
version = "0.3.1"
description = "Estudio de automatizacion de radio: biblioteca por bloques, piloto automatico y crossfade"
authors = ["MiRadio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "miradio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Required for production builds: embeds the interface from ../dist.
# Do NOT force it on for `tauri dev`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "wav", "ogg", "pcm", "alac"] }
ebur128-stream = "0.2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
