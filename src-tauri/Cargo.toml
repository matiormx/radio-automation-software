[package]
name = "miradio"
version = "0.5.45"
description = "Estudio de automatizacion de radio: biblioteca por bloques, piloto automatico y crossfade"
authors = ["MiRadio"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "miradio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Required for production builds: embeds the interface from ../dist.
# Do NOT force it on for `tauri dev`.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.25"
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "wav", "ogg", "pcm", "alac", "mkv"] }
ebur128-stream = "0.2"
ureq = "2"
rubato = "0.16"
cpal = "0.16"
rtrb = "0.3"
tiny_http = "0.12"
sha2 = "0.10"
unicode-normalization = "0.1"
base64 = "0.22"
form_urlencoded = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
