<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/logo">
<link rel="apple-touch-icon" href="/logo">
<title>OmniCaster</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1116; --panel: #171b22; --panel2: #1e242d; --line: #2a3140;
    --text: #e5eaf2; --dim: #8a94a6; --faint: #5d6675;
    --accent: #4f8cff; --live: #e5484d; --ok: #3ddc84; --warn: #f5b942;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top); }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header b { font-size: 16px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hlogo { width: 28px; height: 28px; border-radius: 7px; object-fit: contain; }
  .login .llogo { width: 120px; height: 120px; object-fit: contain; display: block; margin: 0 auto 14px; }
  .conn { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
  .conn.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  main { flex: 1; overflow-y: auto; padding: 14px 16px 90px; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: repeat(6, 1fr);
    background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav button { background: none; border: 0; color: var(--dim); padding: 10px 1px 9px; font-size: 10.5px; display: flex;
    flex-direction: column; align-items: center; gap: 3px; }
  nav button svg { width: 22px; height: 22px; }
  nav button.on { color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
  .now { display: flex; gap: 14px; align-items: center; }
  .cover { width: 96px; height: 96px; border-radius: 10px; object-fit: cover; background: var(--panel2); flex: none; }
  .now h2 { margin: 0 0 4px; font-size: 19px; line-height: 1.2; }
  .now p { margin: 0; color: var(--dim); }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .06em; padding: 2px 7px; border-radius: 5px; margin-bottom: 6px; }
  .tag.live { background: rgba(229,72,77,.18); color: #ff8b8e; }
  .tag.pause { background: var(--panel2); color: var(--dim); }
  .bar { height: 5px; background: var(--panel2); border-radius: 3px; overflow: hidden; margin: 14px 0 4px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .times { display: flex; justify-content: space-between; color: var(--dim); font: 12px ui-monospace, monospace; }
  .transport { display: flex; justify-content: center; align-items: center; gap: 22px; margin-top: 12px; }
  .round { width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel2); color: var(--text);
    display: grid; place-items: center; }
  .round.big { width: 74px; height: 74px; background: var(--accent); border-color: var(--accent); }
  .round svg { width: 26px; height: 26px; }
  .round.big svg { width: 32px; height: 32px; }
  .next { color: var(--dim); font-size: 13.5px; }
  .next b { color: var(--text); font-weight: 600; }
  h3 { font-size: 12px; letter-spacing: .08em; color: var(--faint); margin: 18px 2px 8px; text-transform: uppercase; }
  .row { display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .row .n { width: 26px; color: var(--faint); font: 12px ui-monospace, monospace; text-align: right; }
  .row .t { flex: 1; min-width: 0; }
  .row .t div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .t small { color: var(--dim); }
  .row.past { opacity: .45; }
  .row.cur { background: rgba(229,72,77,.10); border-radius: 8px; }
  .row.nx .n { color: var(--accent); }
  .row .d { color: var(--dim); font: 12px ui-monospace, monospace; }
  .badge { font-size: 9.5px; font-weight: 700; padding: 1px 5px; border-radius: 4px; margin-left: 4px; vertical-align: 1px; }
  .b-live { background: var(--live); color: #fff; }
  .b-next { background: var(--accent); color: #fff; }
  .b-auto { background: var(--panel2); color: var(--dim); }
  .more { background: none; border: 0; color: var(--dim); padding: 8px; font-size: 20px; line-height: 1; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-size: 15px; font-weight: 600; margin-bottom: 10px; }
  .btn.on { background: rgba(229,72,77,.16); border-color: var(--live); color: #ffb3b5; }
  .btn.green.on { background: rgba(61,220,132,.13); border-color: var(--ok); color: #bdf5d4; }
  .btn:disabled { opacity: .45; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); }
  .on .dot { background: var(--live); box-shadow: 0 0 8px var(--live); }
  .green.on .dot { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid2 .btn { margin: 0; }
  .src.on { background: var(--live); border-color: var(--live); color: #fff; }
  .ch { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .ch b { font-weight: 600; }
  .ch .db { font: 13px ui-monospace, monospace; color: var(--dim); text-align: right; min-width: 64px; }
  .ch input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); height: 32px; }
  .ch .mute { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--dim); font-weight: 700; }
  .ch .mute.on { background: var(--live); border-color: var(--live); color: #fff; }
  .stat { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; margin: 10px 0; }
  .stat .bar { margin: 0; }
  .stat b { font: 13px ui-monospace, monospace; }
  .line { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; color: var(--dim); }
  .line b { color: var(--text); font: 13px ui-monospace, monospace; }
  .login { max-width: 320px; margin: 18vh auto 0; text-align: center; }
  .login input { width: 100%; font-size: 28px; letter-spacing: .4em; text-align: center; padding: 12px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); margin: 16px 0; }
  .err { color: #ff8b8e; min-height: 1.3em; }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: flex-end; z-index: 10; }
  .sheet > div { width: 100%; background: var(--panel); border-radius: 16px 16px 0 0; padding: 14px 16px calc(14px + env(safe-area-inset-bottom)); }
  .sheet h4 { margin: 4px 0 12px; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast { position: fixed; left: 16px; right: 16px; bottom: 84px; background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 14px; text-align: center; z-index: 20; }
  .empty { color: var(--faint); text-align: center; padding: 30px 0; }
  .snap { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 10px; object-fit: contain; display: block; }
  .snapnote { color: var(--faint); font-size: 12px; margin-top: 6px; }
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
  .seg button { padding: 10px 4px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--dim); font-weight: 600; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 8px; }
  .item .t { flex: 1; min-width: 0; }
  .item .t b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .t small { color: var(--dim); }
  .item.off { opacity: .55; }
  .sw { width: 46px; height: 28px; border-radius: 14px; border: 0; background: var(--panel2); position: relative; flex: none; }
  .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--dim); transition: left .15s; }
  .sw.on { background: var(--ok); }
  .sw.on::after { left: 21px; background: #fff; }
  .ed { position: fixed; inset: 0; background: var(--bg); z-index: 15; overflow-y: auto; padding: calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
  .ed h4 { margin: 4px 0 14px; font-size: 17px; }
  .ed label { display: block; color: var(--dim); font-size: 12.5px; margin: 12px 0 5px; }
  .ed input[type=text], .ed input[type=time], .ed input[type=number], .ed input[type=datetime-local], .ed select {
    width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 16px; }
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .days button { padding: 9px 0; border-radius: 8px; border: 1px solid var(--line); background: var(--panel2); color: var(--dim); font-weight: 700; }
  .days button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .franja { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 10px; background: var(--panel); }
  .franja .times { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; justify-content: flex-start; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 16px; background: var(--panel2); border: 1px solid var(--line); font: 14px ui-monospace, monospace; color: var(--text); }
  .chip button { background: none; border: 0; color: var(--dim); font-size: 16px; padding: 0; }
  .addt { display: flex; gap: 6px; margin-top: 8px; }
  .addt input { flex: 1; }
  .addt button, .small { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel2); color: var(--text); font-weight: 600; }
  .row2 { display: flex; gap: 8px; align-items: center; }
.lchips { display: flex; gap: 6px; overflow-x: auto; margin: 8px 0; }
.lchip { flex: 0 0 auto; padding: 7px 12px; border-radius: 9px; background: #1b2028; border: 1px solid #2a2f3a; font-size: 12.5px; color: var(--dim); }
.lchip.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.lchip.act { border-color: transparent; color: var(--fg); }
.mixx { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 12px; }
.mstrip { flex: 0 0 132px; background: #171b22; border: 1px solid #2a2f3a; border-radius: 11px; padding: 9px 9px 10px; display: flex; flex-direction: column; gap: 7px; }
.mstrip b { font-size: 12px; line-height: 1.2; min-height: 2.3em; display: flex; align-items: flex-end; word-break: break-word; }
.mstrip input[type=range] { width: 100%; }
.mstrip .db { font-size: 10.5px; color: var(--dim); }
.mstrip .mute { padding: 6px; font-size: 10.5px; width: 100%; }
.sec { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 4px; }
.sec h3 { margin: 0; }
.srhit { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px solid #20242c; }
.srhit .t { flex: 1; min-width: 0; }
.srhit .t small { color: var(--dim); }
.vin .item, .srv .item { cursor: pointer; }
.edsel { display: grid; gap: 8px; }
</style>
</head>
<body>
<header><img class="hlogo" src="/logo" alt=""><b id="station">OmniCaster</b><span class="conn" id="conn"></span></header>
<main id="main"></main>
<nav id="nav"></nav>
<script>
"use strict";
const PAGE_VERSION = "__OC_VERSION__";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (s) => { s = Math.max(0, Math.round(s || 0)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
const icon = {
  play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pause: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  next: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6l8.5 6L6 18zM16 6h2v12h-2z"/></svg>',
  prev: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 6l-8.5 6L18 18zM6 6h2v12H6z"/></svg>',
  live: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M6.3 6.3a8 8 0 0 0 0 11.4M17.7 6.3a8 8 0 0 1 0 11.4"/></svg>',
  list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  air: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3"/></svg>',
  mix: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4v16M12 4v16M18 4v16"/><rect x="4" y="13" width="4" height="3" fill="currentColor"/><rect x="10" y="7" width="4" height="3" fill="currentColor"/><rect x="16" y="11" width="4" height="3" fill="currentColor"/></svg>',
  sys: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg>',
  agenda: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
};
const TABS = [["live", "Directo"], ["list", "Lista"], ["air", "Emisión"], ["agenda", "Agenda"], ["mix", "Mesa"], ["sys", "Sistema"]];

let token = localStorage.getItem("oc.token") || "";
let brandName = "OmniCaster";
fetch("/api/brand").then((r) => r.json()).then((b) => {
  brandName = b.name || brandName;
  document.title = brandName;
  if (!S) $("#station").textContent = brandName;
  const l = document.getElementById("lname");
  if (l) l.textContent = brandName;
}).catch(() => {});
let tab = localStorage.getItem("oc.tab") || "live";
let S = null; // estado publicado
let gotAt = 0;
let es = null;
let sys = null;
let dragging = false;

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

async function cmd(body) {
  try {
    const r = await fetch(`/api/cmd?t=${encodeURIComponent(token)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (r.status === 401) return logout();
    if (!r.ok) toast("No se pudo");
  } catch { toast("Sin conexión con el estudio"); }
}

function logout() {
  token = "";
  localStorage.removeItem("oc.token");
  es?.close();
  es = null;
  showLogin();
}

function showLogin(err = "") {
  $("#nav").innerHTML = "";
  $("#conn").className = "conn";
  $("#main").innerHTML = `<div class="login"><img class="llogo" src="/logo" alt=""><h2 id="lname">${esc(brandName)}</h2><div style="color:var(--dim)">Escribe el PIN que aparece en Ajustes › Control desde el móvil</div>
    <input id="pin" type="password" inputmode="numeric" autocomplete="one-time-code" maxlength="12" autofocus>
    <button class="btn" id="go" style="background:var(--accent);border-color:var(--accent)">Entrar</button><div class="err" id="err">${esc(err)}</div></div>`;
  const go = async () => {
    const pin = $("#pin").value.trim();
    if (!pin) return;
    try {
      const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ pin }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { $("#err").textContent = j.error || "No se pudo entrar"; return; }
      token = j.token;
      localStorage.setItem("oc.token", token);
      start();
    } catch { $("#err").textContent = "Sin conexión con el estudio"; }
  };
  $("#go").onclick = go;
  // Solo Intro hace algo (devolver false en onkeydown impedía escribir)
  $("#pin").addEventListener("keydown", (e) => {
    if (e.key === "Enter") go();
  });
}

function start() {
  renderNav();
  connect();
  render();
}

function connect() {
  es?.close();
  es = new EventSource(`/api/events?t=${encodeURIComponent(token)}`);
  es.onopen = () => ($("#conn").className = "conn on");
  es.onmessage = (e) => {
    try { S = JSON.parse(e.data); gotAt = Date.now(); } catch { return; }
    // OmniCaster se ha actualizado: página nueva (la app del móvil no se recarga sola)
    if (S.app && S.app.version && PAGE_VERSION !== "__OC_" + "VERSION__" && S.app.version !== PAGE_VERSION && !editing) {
      location.reload();
      return;
    }
    if (!dragging) render();
  };
  es.addEventListener("logout", () => logout());
  es.onerror = async () => {
    $("#conn").className = "conn";
    // ¿Token caducado (PIN cambiado o OmniCaster reiniciado)?
    try { const r = await fetch(`/api/sys?t=${encodeURIComponent(token)}`); if (r.status === 401) logout(); } catch {}
  };
}

function renderNav() {
  $("#nav").innerHTML = TABS.map(([k, l]) => `<button data-tab="${k}" class="${tab === k ? "on" : ""}">${icon[k]}<span>${l}</span></button>`).join("");
  $("#nav").onclick = (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    tab = b.dataset.tab;
    listScrolled = false;
    localStorage.setItem("oc.tab", tab);
    renderNav();
    render();
    $("#main").scrollTop = 0;
  };
}

const coverUrl = (f) => (f ? `/api/cover?t=${encodeURIComponent(token)}&f=${encodeURIComponent(f)}` : "");

function render() {
  if (!token) return;
  if (!S || !S.now) { $("#main").innerHTML = '<div class="empty">Esperando a OmniCaster…</div>'; return; }
  $("#station").textContent = S.station || brandName;
  const view = { live: viewLive, list: viewList, air: viewAir, agenda: viewAgenda, mix: viewMix, sys: viewSys }[tab] || viewLive;
  view();
}

function viewLive() {
  const n = S.now;
  const pos = n.playing ? n.pos + (Date.now() - gotAt) / 1000 : n.pos;
  const pct = n.dur > 0 ? Math.min(100, (pos / n.dur) * 100) : 0;
  $("#main").innerHTML = `
    <div class="card">
      <div class="now">
        ${n.cover ? `<img class="cover" src="${coverUrl(n.cover)}" alt="">` : '<div class="cover"></div>'}
        <div style="min-width:0">
          <span class="tag ${n.playing ? "live" : "pause"}">${n.title ? (n.playing ? "AL AIRE" : "EN PAUSA") : "PARADO"}</span>
          <h2>${esc(n.title || "Sin emisión")}</h2><p>${esc(n.artist)}</p>
        </div>
      </div>
      <div class="bar"><i id="prog" style="width:${pct}%"></i></div>
      <div class="times"><span id="cur">${fmt(pos)}</span><span>-${fmt(n.dur - pos)}</span></div>
      <div class="transport">
        <button class="round" data-c="prev" aria-label="Anterior">${icon.prev}</button>
        <button class="round big" data-c="toggle" aria-label="Reproducir o pausar">${n.playing ? icon.pause : icon.play}</button>
        <button class="round" data-c="next" aria-label="Siguiente">${icon.next}</button>
      </div>
    </div>
    <div class="card next">Siguiente: ${S.next ? `<b>${esc(S.next.title)}</b> — ${esc(S.next.artist)}` : "<b>nada</b>"}</div>
    <button class="btn green ${S.autopilot ? "on" : ""}" data-c="autopilot"><span class="dot"></span>Piloto automático ${S.autopilot ? "activado" : "apagado"}</button>`;
  $("#main").onclick = (e) => {
    const b = e.target.closest("[data-c]");
    if (!b) return;
    const c = b.dataset.c;
    if (c === "autopilot") cmd({ cmd: "autopilot", on: !S.autopilot });
    else cmd({ cmd: c });
  };
}

let showPast = false;
let listScrolled = false;
function viewList() {
  const all = S.rows || [];
  const lists = S.lists || [];
  if (!lists.length) { $("#main").innerHTML = '<div class="empty">Sin listas todavía</div>'; return; }
  const keep = S.pastVisible ?? 5;
  const firstShown = showPast || S.playing < 0 ? 0 : Math.max(0, S.playing - keep);
  const rows = all.slice(firstShown);
  const hidden = firstShown;
  const autoChips = collections().map((b) => `<button class="lchip ${S.autodj === b.id ? "on" : ""}" data-dj="${esc(b.id)}">${esc(b.name)}</button>`).join("");
  $("#main").innerHTML = `<div class="lchips">${lists.map((l) => `<button class="lchip ${l.current ? "on" : ""}" data-list="${esc(l.id)}">${esc(l.name)}</button>`).join("")}</div>
    <div class="lchips">${autoChips.length ? '<span class="lchip" style="border:none;padding:7px 4px">AUTO pilla de:</span>' + autoChips + `<button class="lchip ${S.autodj === "" ? "on" : ""}" data-dj="">Automático</button>` : ""}</div>
    <h3>${esc(S.listName || "Lista")} · ${all.length} pistas
      <button class="btn" data-addtrk="1" style="padding:6px 10px;float:right">+ Añadir</button>
      <button class="btn" data-clear="1" style="padding:6px 10px;float:right;margin-right:6px;border-color:#ff8b8e;color:#ff8b8e">Vaciar</button>
    </h3>
    ${hidden ? `<button class="btn" data-past="1" style="padding:9px;font-size:13px;font-weight:500;color:var(--dim)">${hidden} canciones emitidas ocultas · ver</button>`
      : showPast && S.playing > keep ? '<button class="btn" data-past="1" style="padding:9px;font-size:13px;font-weight:500;color:var(--dim)">Ocultar las emitidas</button>' : ""}
    ${rows.length ? rows.map((r) => {
    const cls = r.i === S.playing ? "cur" : r.i < S.playing ? "past" : r.i === S.nextRow ? "nx" : "";
    const b = r.i === S.playing ? '<span class="badge b-live">AL AIRE</span>' : r.i === S.nextRow ? '<span class="badge b-next">SIGUIENTE</span>' : r.auto ? '<span class="badge b-auto">AUTO</span>' : "";
    return `<div class="row ${cls}"><span class="n">${r.i + 1}</span><div class="t"><div>${esc(r.title)}${b}</div><small>${esc(r.artist)}</small></div>
      <span class="d">${fmt(r.dur)}</span><button class="more" data-i="${r.i}" aria-label="Opciones">⋯</button></div>`;
  }).join("") : '<div class="empty">La lista está vacía</div>'}`;
  $("#main").onclick = (e) => {
    if (e.target.closest("[data-past]")) { showPast = !showPast; listScrolled = false; return viewList(); }
    const listBtn = e.target.closest("[data-list]");
    if (listBtn) { cmd({ cmd: "listSwitch", id: listBtn.dataset.list }); return; }
    const dj = e.target.closest("[data-dj]");
    if (dj) { cmd({ cmd: "autodjList", id: dj.dataset.dj }); return; }
    if (e.target.closest("[data-clear]")) {
      if (confirm("¿Vaciar esta lista? Lo que está sonando sigue hasta el final.")) cmd({ cmd: "playlistClear" });
      return;
    }
    if (e.target.closest("[data-addtrk]")) return openSearch();
    const b = e.target.closest("[data-i]");
    if (b) sheet(Number(b.dataset.i));
  };
  if (!listScrolled) {
    listScrolled = true;
    const cur = $("#main .row.cur");
    if (cur) cur.scrollIntoView({ block: "center" });
  }
}

/* Bloques (listas musico) que pilla el piloto automatico */
function collections() {
  return (S.blocks || []).filter((b) => b.id && b.name);
}

/* Buscador de canciones para anadir a la lista: publica S.hits */
function openSearch() {
  document.getElementById("srch")?.remove();
  const el = document.createElement("div");
  el.id = "srch";
  el.className = "ed";
  el.innerHTML = `<h4>Añadir canción a «${esc(S.listName || "la lista")}»</h4>
    <input type="search" id="sq" placeholder="Título, artista o álbum…">
    <div id="shits" style="max-height:60vh;overflow-y:auto;margin-top:8px"></div>
    <div style="height:12px"></div><button class="btn" data-sclose="1">Cerrar</button>`;
  document.body.appendChild(el);
  el.onclick = (e) => {
    if (e.target.closest("[data-sclose]")) { el.remove(); cmd({ cmd: "librarySearch", q: "" }); }
    const hit = e.target.closest("[data-add]");
    if (hit) { cmd({ cmd: "playlistAddTrack", trackId: hit.dataset.add }); el.remove(); }
  };
  const input = el.querySelector("#sq");
  let t = 0;
  input?.addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(() => { renderHits(); cmd({ cmd: "librarySearch", q: input.value }); }, 350);
    renderHits();
  });
  input?.focus();
  renderHits();
  // Se refresca cuando llega la respuesta por el canal SSE
  clearInterval(window.__srchTimer);
  window.__srchTimer = setInterval(() => { if (!document.getElementById("srch")) { clearInterval(window.__srchTimer); return; } renderHits(); }, 400);
}
function renderHits() {
  const box = document.getElementById("shits");
  if (!box) return;
  const hits = S.hits || [];
  box.innerHTML = hits.length
    ? hits.map((h) => `<div class="srhit"><div class="t"><div>${esc(h.title)}</div><small>${esc(h.artist)}</small></div><button class="btn" data-add="${esc(h.id)}">Añadir</button></div>`).join("")
    : '<div class="snapnote" style="text-align:center">Sin resultados todavía (escribí algo y espera un segundo)</div>';
}

function sheet(i) {
  const r = (S.rows || []).find((x) => x.i === i);
  if (!r) return;
  const playing = i === S.playing;
  const el = document.createElement("div");
  el.className = "sheet";
  el.innerHTML = `<div><h4>${esc(r.title)} — ${esc(r.artist)}</h4>
    ${playing ? "" : `<button class="btn" data-a="play">Emitir ahora</button><button class="btn" data-a="next">Marcar como siguiente</button>`}
    <div class="grid2"><button class="btn" data-a="up" ${i === 0 ? "disabled" : ""}>Subir</button><button class="btn" data-a="down" ${i >= S.rows.length - 1 ? "disabled" : ""}>Bajar</button></div>
    <div style="height:10px"></div>
    ${playing ? "" : '<button class="btn" data-a="remove" style="color:#ff8b8e">Quitar de la lista</button>'}
    <button class="btn" data-a="close">Cerrar</button></div>`;
  el.onclick = (e) => {
    const a = e.target.closest("[data-a]")?.dataset.a;
    if (e.target === el || a === "close") return el.remove();
    if (!a) return;
    if (a === "play") cmd({ cmd: "playRow", i });
    if (a === "next") cmd({ cmd: "setNext", i });
    if (a === "up") cmd({ cmd: "move", from: i, to: i - 1 });
    if (a === "down") cmd({ cmd: "move", from: i, to: i + 1 });
    if (a === "remove") cmd({ cmd: "remove", i });
    el.remove();
  };
  document.body.appendChild(el);
}

function viewAir() {
  const st = S.stream || {};
  const v = S.video || {};
  $("#main").innerHTML = `
    <h3>Lo que se emite</h3>
    <div class="card" style="padding:8px"><img class="snap" id="snap" alt="" ${snapUrl ? `src="${snapUrl}"` : ""}>
      <div class="snapnote" id="snapnote">${snapNote}</div></div>
    <h3>Emisión</h3>
    <button class="btn ${st.audioOn ? "on" : ""}" data-c="audio" ${!st.audioReady || st.busy ? "disabled" : ""}><span class="dot"></span>${st.audioOn ? "AUDIO · EN VIVO" : "EMITIR AUDIO"}</button>
    <button class="btn ${st.videoOn ? "on" : ""}" data-c="vid" ${!st.videoReady || st.busy ? "disabled" : ""}><span class="dot"></span>${st.videoOn ? "VÍDEO · EN VIVO" : "EMITIR VÍDEO"}</button>
    ${(v.sources || []).length ? `<h3>Vídeo al aire</h3><div class="grid2">${v.sources.map((s) => `<button class="btn src ${s.key === v.current ? "on" : ""}" data-src="${esc(s.key)}">${esc(s.label)}</button>`).join("")}</div>
    <div style="height:10px"></div>
    <button class="btn green ${v.monitor ? "on" : ""}" data-c="monitor"><span class="dot"></span>Monitor de presentadores ${v.monitor ? "encendido" : "apagado"}</button>` : ""}
    <div class="sec"><h3>Entradas de vídeo</h3><button class="btn" data-vin-new="1">+ Nueva</button></div>
    ${(S.videoInputs || []).map((x) => `<div class="item vin" data-vin="${esc(x.id)}">
      <div class="t"><b>${esc(x.name || x.source || "Sin nombre")}</b><small>${esc(x.kind)} · ${esc(x.source || "—")}</small></div>
      <button class="sw ${x.enabled ? "on" : ""}" data-vinsw="${esc(x.id)}" aria-label="Activar"></button></div>`).join("")}`;
  $("#main").onclick = (e) => {
    const s = e.target.closest("[data-src]");
    if (s) return cmd({ cmd: "video", key: s.dataset.src });
    const c = e.target.closest("[data-c]")?.dataset.c;
    if (c === "audio") cmd({ cmd: "stream", group: "audio", on: !st.audioOn });
    if (c === "vid") cmd({ cmd: "stream", group: "video", on: !st.videoOn });
    if (c === "monitor") cmd({ cmd: "monitor", on: !v.monitor });
    if (e.target.closest("[data-vin-new]")) return openVin(null);
    const sw = e.target.closest("[data-vinsw]");
    if (sw) {
      const x = (S.videoInputs || []).find((i) => i.id === sw.dataset.vinsw);
      if (x) cmd({ cmd: "videoInputsUpdate", inputs: (S.videoInputs || []).map((i) => (i.id === x.id ? { ...i, enabled: !i.enabled } : i)) });
      sw.classList.toggle("on");
      return;
    }
    const it = e.target.closest(".item[data-vin]");
    if (it) openVin(it.dataset.vin);
  };
}

/* Editor de una entrada de video (mobile) */
function openVin(id) {
  const cur = (S.videoInputs || []).find((i) => i.id === id);
  const d = cur ? { ...cur } : { id: "", name: "", kind: "ndi", source: "", enabled: true };
  editing = { kind: "__vin", id, d: JSON.parse(JSON.stringify(d)) };
  dragging = true;
  const el = document.createElement("div");
  el.id = "ed"; el.className = "ed";
  const kinds = [["ndi", "NDI (nombre de la fuente)"], ["rtmp", "RTMP / URL"], ["file", "Archivo local"], ["capture", "Capturadora"]];
  el.innerHTML = `<h4>Entrada de vídeo ${id ? "" : "nueva"}</h4>
    <label>Nombre</label><input type="text" data-f="name" value="${esc(d.name)}">
    <label>Tipo</label><select data-f="kind">${kinds.map((k) => `<option value="${k[0]}" ${d.kind === k[0] ? "selected" : ""}>${k[1]}</option>`).join("")}</select>
    <label data-src-l>${d.kind === "ndi" ? "Nombre de la fuente NDI" : d.kind === "file" ? "Ruta del archivo" : "URL / fuente"}</label><input type="text" data-f="source" value="${esc(d.source)}">
    <div style="height:12px"></div>
    <button class="btn" data-vsave="1" style="background:var(--accent);border-color:var(--accent);color:#fff">Guardar</button>
    ${id ? '<button class="btn" data-vdel="1" style="color:#ff8b8e">Quitar</button>' : ""}
    <button class="btn" data-close="1">Cancelar</button>`;
  el.oninput = (e) => {
    const f = e.target.dataset.f;
    if (!f) return;
    editing.d[f] = e.target.value;
    if (f === "kind") { el.querySelector("[data-src-l]").textContent = e.target.value === "ndi" ? "Nombre de la fuente NDI" : e.target.value === "file" ? "Ruta del archivo" : "URL / fuente"; }
  };
  el.onclick = (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    const close = () => { el.remove(); editing = null; dragging = false; };
    if (t.dataset.close) return close();
    if (t.dataset.vsave) {
      const d = editing.d;
      if (!String(d.name || "").trim() && !String(d.source || "").trim()) { return toast("Pon nombre o fuente"); }
      const inputs = (S.videoInputs || []).filter((i) => i.id !== id);
      inputs.push({ ...d, id: d.id || `i${Date.now().toString(36)}`, name: String(d.name || "").trim() });
      cmd({ cmd: "videoInputsUpdate", inputs });
      toast("Guardado");
      return close();
    }
    if (t.dataset.vdel) {
      if (confirm("¿Quitar esta entrada de vídeo?")) {
        cmd({ cmd: "videoInputsUpdate", inputs: (S.videoInputs || []).filter((i) => i.id !== id) });
        close();
      }
      return;
    }
  };
  document.body.appendChild(el);
}

// ---- Monitor de vídeo: una imagen cada segundo y medio mientras se mira ----
let snapUrl = "";
let snapNote = "Cargando imagen…";
let snapBusy = false;
async function loadSnap() {
  if (snapBusy || tab !== "air" || !token || document.hidden || !S) return;
  snapBusy = true;
  try {
    const r = await fetch(`/api/snap?t=${encodeURIComponent(token)}&src=${encodeURIComponent(S.snap || "np")}&n=${Date.now()}`);
    if (r.status === 401) return logout();
    if (r.status === 204) {
      snapNote = "Sin imagen ahora mismo (el vídeo no está en marcha o la fuente no manda imagen).";
    } else if (r.ok) {
      const url = URL.createObjectURL(await r.blob());
      if (snapUrl) URL.revokeObjectURL(snapUrl);
      snapUrl = url;
      const label = S.snap && S.snap.startsWith("out:")
        ? "Lo que sale"
        : S.snap && S.snap.startsWith("ndi:")
          ? esc(S.snap.slice(4))
          : "Lo que suena";
      snapNote = `Actualizado ${new Date().toLocaleTimeString("es-ES")} · ${label}`;
    }
    const img = document.getElementById("snap");
    if (img && snapUrl && img.src !== snapUrl) img.src = snapUrl;
    const note = document.getElementById("snapnote");
    if (note) note.textContent = snapNote;
  } catch {} finally { snapBusy = false; }
}
setInterval(loadSnap, 1500);

// ---- Agenda: eventos, campañas y programas ----
const DAYS = ["L", "M", "X", "J", "V", "S", "D"];
const DAYS_LONG = ["lunes", "martes", "miércoles", "jueves", "viernes", "sábado", "domingo"];
let agTab = localStorage.getItem("oc.ag") || "events";
let editing = null; // {kind, id, draft}

function daysText(days) {
  const d = [...(days || [])].sort();
  if (d.length === 7) return "Todos los días";
  if (d.join() === "1,2,3,4,5") return "Lunes a viernes";
  if (d.join() === "6,7") return "Fines de semana";
  if (!d.length) return "Ningún día";
  return d.map((x) => DAYS_LONG[x - 1]).join(", ");
}
function schedText(scheds, kind) {
  return (scheds || []).map((b) => {
    const when = kind === "campaign" && b.hourly ? `cada hora a los ${String(b.minute || 0).padStart(2, "0")}` : b.start && b.end ? `${b.start}–${b.end}` : (b.times || []).join(", ") || "sin horas";
    return `${daysText(b.days)} · ${when}`;
  }).join(" | ");
}
const KIND = { auto: "Franja AutoDJ", insert: "Inserción", stream: "Internet" };
const TIMEOUT = { next: "como siguiente canción", force: "forzar", cancel: "cancelar" };

function viewAgenda() {
  const ag = S.agenda || { events: [], campaigns: [], programs: [] };
  const list = ag[agTab] || [];
  const kind = agTab === "events" ? "event" : agTab === "campaigns" ? "campaign" : "program";
  const sub = (x) => {
    if (kind === "event") return `${KIND[x.kind] || ""} · ${schedText(x.schedules, "event")}${x.kind === "insert" ? ` · ${TIMEOUT[x.onTimeout] || ""}` : ""}`;
    if (kind === "campaign") return `${x.kind === "jingle" ? "Jingle" : "Anuncio"} · ${x.spots} cuñas · ${schedText(x.schedules, "campaign")}`;
    return `${x.subtitle ? esc(x.subtitle) + " · " : ""}${x.startsAt || "sin hora"}`;
  };
  $("#main").innerHTML = `<div class="seg">
      <button data-ag="events" class="${agTab === "events" ? "on" : ""}">Eventos</button>
      <button data-ag="campaigns" class="${agTab === "campaigns" ? "on" : ""}">Campañas</button>
      <button data-ag="programs" class="${agTab === "programs" ? "on" : ""}">Programas</button></div>
    ${list.length ? list.map((x) => `<div class="item ${x.enabled ? "" : "off"}" data-id="${esc(x.id)}">
      <div class="t"><b>${esc(x.name || "Sin nombre")}</b><small>${esc(sub(x))}</small></div>
      <button class="sw ${x.enabled ? "on" : ""}" data-sw="${esc(x.id)}" aria-label="Activar"></button></div>`).join("") : `<div class="empty">No hay ${agTab === "events" ? "eventos" : agTab === "campaigns" ? "campañas" : "programas"}</div>`}
    ${kind === "program" ? '<button class="btn" data-new="1">+ Nuevo programa</button>' : kind === "event" ? '<button class="btn" data-new="1">+ Nuevo evento</button>' : '<div class="snapnote" style="text-align:center">Las campañas y sus cuñas se crean desde el ordenador; aquí se pueden activar, duplicar o borrar.</div>'}`;
  $("#main").onclick = (e) => {
    const seg = e.target.closest("[data-ag]");
    if (seg) { agTab = seg.dataset.ag; localStorage.setItem("oc.ag", agTab); return viewAgenda(); }
    const sw = e.target.closest("[data-sw]");
    if (sw) {
      const x = list.find((i) => i.id === sw.dataset.sw);
      if (x) { x.enabled = !x.enabled; viewAgenda(); cmd({ cmd: "cfgToggle", kind, id: x.id, on: x.enabled }); }
      return;
    }
    if (e.target.closest("[data-new]")) return openEditor("program", null);
    const it = e.target.closest(".item");
    if (it) openEditor(kind, it.dataset.id);
  };
}

function openEditor(kind, id) {
  const ag = S.agenda || {};
  const src = kind === "event" ? ag.events : kind === "campaign" ? ag.campaigns : ag.programs;
  const x = id
    ? (src || []).find((i) => i.id === id)
    : kind === "event"
      ? { name: "", enabled: true, kind: "auto", sourceKind: "library", sourceId: "a", trackMode: "random", onTimeout: "cancel", maxWaitSecs: 60, schedules: [] }
      : { name: "", subtitle: "", startsAt: "", enabled: true };
  if (!x) return;
  editing = { kind, id, d: JSON.parse(JSON.stringify(x)) };
  if (kind !== "program" && !(editing.d.schedules || []).length) editing.d.schedules = [{ id: "s0", days: [1, 2, 3, 4, 5, 6, 7], times: [] }];
  dragging = true; // que no se repinte mientras se edita
  renderEditor();
}

function renderEditor() {
  const { kind, id, d } = editing;
  let el = document.getElementById("ed");
  if (!el) { el = document.createElement("div"); el.id = "ed"; el.className = "ed"; document.body.appendChild(el); }
  const isStream = kind === "event" && d.kind === "stream";
  const franjas = kind === "program" ? "" : `<label>Horarios</label>` + (d.schedules || []).map((b, bi) => `
    <div class="franja" data-b="${bi}">
      <div class="days">${DAYS.map((l, di) => `<button data-day="${di + 1}" class="${(b.days || []).includes(di + 1) ? "on" : ""}">${l}</button>`).join("")}</div>
      ${isStream ? `<div class="row2" style="margin-top:8px"><input type="time" data-f="start" value="${esc(b.start || "")}"><span>a</span><input type="time" data-f="end" value="${esc(b.end || "")}"></div>`
        : kind === "campaign" && b.hourly ? `<div class="row2" style="margin-top:8px">Cada hora, minuto <input type="number" min="0" max="59" data-f="minute" value="${b.minute || 0}" style="width:90px"></div>`
        : `<div class="times">${(b.times || []).map((t, ti) => `<span class="chip">${esc(t)}<button data-rmt="${ti}" aria-label="Quitar">×</button></span>`).join("") || '<span class="snapnote">Sin horas</span>'}</div>
           <div class="addt"><input type="time" data-newt><button data-addt="1">Añadir hora</button></div>`}
      ${kind === "campaign" ? `<div class="row2" style="margin-top:8px"><button class="small" data-hourly="1">${b.hourly ? "Horas concretas" : "Cada hora"}</button></div>` : ""}
      ${(d.schedules || []).length > 1 ? '<button class="small" data-rmb="1" style="margin-top:8px;color:#ff8b8e">Quitar franja</button>' : ""}
    </div>`).join("") + '<button class="btn" data-addb="1" style="margin-top:10px">+ Otra franja</button>';
  const blocks = collections();
  const kaynak = kind === "event" && (d.kind === "auto" || d.kind === "insert")
    ? `<label>Fuente</label><select data-f="sourceKind">
        <option value="block" ${d.sourceKind === "block" ? "selected" : ""}>Un bloque musical</option>
        <option value="library" ${d.sourceKind !== "block" ? "selected" : ""}>Toda la biblioteca</option></select>
      ${d.sourceKind === "block" ? `<select data-f="sourceId">${blocks.length ? blocks.map((b) => `<option value="${esc(b.id)}" ${d.sourceId === b.id ? "selected" : ""}>${esc(b.name)}</option>`).join("") : '<option value="a">Sin bloques (elegirá de la biblioteca)</option>'}</select>` : ""}
      ${d.kind === "insert" ? `<label style="display:flex;align-items:center;gap:6px"><input type="checkbox" data-f="__rand" ${d.trackMode !== "fixed" ? "checked" : ""}> Elegir los sonidos al azar de esa fuente</label>` : ""}`
    : "";
  const streamUrl = kind === "event" && d.kind === "stream"
    ? `<label>Fuente de audio (URL http… o ruta de archivo)</label><input type="text" data-f="streamUrl" value="${esc(d.streamUrl || "")}">`
    : "";
  el.innerHTML = `<h4>${kind === "event" ? "Evento" : kind === "campaign" ? "Campaña" : "Programa"}${id ? "" : " nuevo"}</h4>
    <label>Nombre</label><input type="text" data-f="name" value="${esc(d.name)}">
    ${kind === "event" ? `<label>Tipo</label><select data-f="kind">
      <option value="auto" ${d.kind === "auto" ? "selected" : ""}>Franja AutoDJ</option>
      <option value="insert" ${d.kind === "insert" ? "selected" : ""}>Sonido (pista o cuña)</option>
      <option value="stream" ${d.kind === "stream" ? "selected" : ""}>Emisión de internet</option></select>${kaynak}${streamUrl}` : ""}
    ${kind === "program" ? `<label>Subtítulo (va como artista)</label><input type="text" data-f="subtitle" value="${esc(d.subtitle || "")}">
      <label>Empieza a las</label><input type="time" data-f="startsAt" value="${esc(d.startsAt || "")}">` : ""}
    ${kind === "event" && d.kind === "insert" ? `<label>Cuándo suena</label><select data-f="onTimeout">
      <option value="next" ${d.onTimeout === "next" ? "selected" : ""}>Como siguiente canción (sin cortar)</option>
      <option value="force" ${d.onTimeout === "force" ? "selected" : ""}>Esperar como mucho… y luego forzar</option>
      <option value="cancel" ${d.onTimeout === "cancel" ? "selected" : ""}>Esperar como mucho… y si no, cancelar</option></select>
      ${d.onTimeout !== "next" ? `<label>Espera máxima (segundos)</label><input type="number" min="0" max="3600" data-f="maxWaitSecs" value="${d.maxWaitSecs || 0}">` : ""}` : ""}
    ${kind === "campaign" ? `<label>Empieza (vacío = ya)</label><input type="datetime-local" data-f="startAt" value="${esc(d.startAt || "")}">
      <label>Termina (vacío = sin fin)</label><input type="datetime-local" data-f="endAt" value="${esc(d.endAt || "")}">` : ""}
    ${franjas}
    <div style="height:14px"></div>
    <button class="btn" data-save="1" style="background:var(--accent);border-color:var(--accent);color:#fff">Guardar</button>
    ${id ? '<div class="grid2"><button class="btn" data-dup="1">Duplicar</button><button class="btn" data-del="1" style="color:#ff8b8e">Borrar</button></div><div style="height:10px"></div>' : ""}
    <button class="btn" data-close="1">Cancelar</button>`;
  el.oninput = (e) => {
    const f = e.target.dataset.f;
    if (!f) return;
    if (f === "__rand") { d.trackMode = e.target.checked ? "random" : "fixed"; return; }
    const fr = e.target.closest("[data-b]");
    const v = e.target.type === "number" ? Number(e.target.value) : e.target.value;
    if (fr) d.schedules[Number(fr.dataset.b)][f] = v; else d[f] = v;
    if (f === "onTimeout" || (kind === "event" && (f === "kind" || f === "sourceKind"))) return renderEditor();
  };
  el.onclick = (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    const fr = t.closest("[data-b]");
    const b = fr ? d.schedules[Number(fr.dataset.b)] : null;
    if (t.dataset.day && b) { const n = Number(t.dataset.day); b.days = b.days.includes(n) ? b.days.filter((x) => x !== n) : [...b.days, n].sort(); return renderEditor(); }
    if (t.dataset.rmt && b) { b.times.splice(Number(t.dataset.rmt), 1); return renderEditor(); }
    if (t.dataset.addt && b) { const v = fr.querySelector("[data-newt]").value; if (v && !b.times.includes(v)) { b.times = [...b.times, v].sort(); } return renderEditor(); }
    if (t.dataset.hourly && b) { b.hourly = !b.hourly; return renderEditor(); }
    if (t.dataset.rmb && fr) { d.schedules.splice(Number(fr.dataset.b), 1); return renderEditor(); }
    if (t.dataset.addb) { d.schedules.push({ id: `s${Date.now().toString(36)}`, days: [1, 2, 3, 4, 5, 6, 7], times: [] }); return renderEditor(); }
    if (t.dataset.close) return closeEditor();
    if (t.dataset.del) { if (confirm(`¿Borrar «${d.name || "sin nombre"}»?`)) { cmd({ cmd: "cfgDelete", kind, id }); closeEditor(); } return; }
    if (t.dataset.dup) { cmd({ cmd: "cfgDuplicate", kind, id }); toast("Duplicado (queda apagado)"); return closeEditor(); }
    if (t.dataset.save) {
      if (!String(d.name || "").trim()) return toast("Ponle un nombre");
      if (kind === "program" && !id) cmd({ cmd: "cfgNewProgram", name: d.name, subtitle: d.subtitle, startsAt: d.startsAt });
      else if (kind === "event" && !id) {
        const patch = { name: d.name, kind: d.kind || "auto", sourceKind: d.sourceKind || "library", sourceId: d.sourceId || "a", trackMode: d.trackMode === "fixed" ? "fixed" : "random", onTimeout: d.onTimeout || "cancel", maxWaitSecs: d.maxWaitSecs || 0, schedules: d.schedules, streamUrl: d.streamUrl || "" };
        cmd({ cmd: "cfgNewEvent", patch });
      } else {
        const patch = { name: d.name };
        if (kind !== "program") patch.schedules = d.schedules;
        if (kind === "event") { patch.onTimeout = d.onTimeout; patch.maxWaitSecs = d.maxWaitSecs; patch.kind = d.kind; patch.sourceKind = d.sourceKind; patch.sourceId = d.sourceId; patch.trackMode = d.trackMode === "fixed" ? "fixed" : "random"; patch.streamUrl = d.streamUrl || ""; }
        if (kind === "campaign") { patch.startAt = d.startAt || ""; patch.endAt = d.endAt || ""; }
        if (kind === "program") { patch.subtitle = d.subtitle || ""; patch.startsAt = d.startsAt || ""; }
        cmd({ cmd: "cfgSave", kind, id, patch });
      }
      toast("Guardado");
      closeEditor();
    }
  };
}

function closeEditor() {
  document.getElementById("ed")?.remove();
  editing = null;
  dragging = false;
  render();
}

// Fader: 0..1000 -> dB (curva como una mesa: más recorrido cerca de 0 dB)
const toDb = (x) => (x <= 0 ? -60 : x >= 1000 ? 12 : x <= 750 ? -60 + (x / 750) * 60 : ((x - 750) / 250) * 12);
const fromDb = (db) => (db <= -60 ? 0 : db <= 0 ? ((db + 60) / 60) * 750 : 750 + (Math.min(12, db) / 12) * 250);
const dbText = (db) => (db <= -60 ? "−∞" : `${db > 0 ? "+" : ""}${db.toFixed(1)} dB`);

function viewMix() {
  const chans = S.mixer || [];
  const buses = S.buses || [];
  const strip = (c, kind) => `<div class="mstrip" data-kind="${kind}" data-id="${esc(c.id)}"><b>${esc(c.name)}</b>
      <input type="range" min="0" max="1000" step="1" value="${Math.round(fromDb(c.gainDb))}" ${kind === "m" ? 'style="direction:ltr"' : ""} aria-label="Volumen de ${esc(c.name)}">
      <span class="db">${dbText(c.gainDb)}</span>
      ${kind !== "m" ? `<button class="mute ${c.muted ? "on" : ""}">${c.muted ? "SILENCIADO" : "SILENCIAR"}</button>` : ""}</div>`;
  $("#main").innerHTML = `<h3>Mesa completa · desplázate de lado →</h3><div class="mixx">
      ${chans.map((c) => strip(c, "c")).join("")}
      ${buses.map((b) => strip(b, "b")).join("")}
      ${strip({ id: "master", name: "Master", gainDb: toDb(Math.min(1, S.master ?? 1)) }, "m")}
    </div>`;
  let timer = 0;
  $("#main").oninput = (e) => {
    const r = e.target.closest("input[type=range]");
    if (!r) return;
    dragging = true;
    const wrap = r.closest(".mstrip");
    const id = wrap.dataset.id;
    const kind = wrap.dataset.kind;
    if (kind === "m") {
      // master en lineal 0..1 (la mesa usa dB para canales y buses)
      const v = Math.pow(10, toDb(Number(r.value)) / 20);
      r.closest(".mstrip").querySelector(".db").textContent = `${Math.round(Math.min(1, v) * 100)} %`;
      clearTimeout(timer);
      timer = setTimeout(() => cmd({ cmd: "masterFader", value: Math.min(1, v) }), 80);
    } else {
      const db = Math.round(toDb(Number(r.value)) * 10) / 10;
      r.closest(".mstrip").querySelector(".db").textContent = dbText(db);
      clearTimeout(timer);
      timer = setTimeout(() => cmd({ cmd: kind === "b" ? "busFader" : "fader", id, db }), 60);
    }
  };
  $("#main").onchange = () => setTimeout(() => (dragging = false), 400);
  $("#main").onclick = (e) => {
    const m = e.target.closest(".mute");
    if (!m) return;
    const wrap = m.closest(".mstrip");
    const kind = wrap.dataset.kind;
    const id = wrap.dataset.id;
    const c = (kind === "b" ? buses : chans).find((x) => x.id === id);
    cmd({ cmd: kind === "b" ? "busMute" : "mute", id, on: !c?.muted });
  };
}

async function loadSys() {
  try {
    const r = await fetch(`/api/sys?t=${encodeURIComponent(token)}`);
    if (r.status === 401) return logout();
    sys = await r.json();
    if (tab === "sys") viewSys();
  } catch {}
}
setInterval(() => tab === "sys" && token && !document.hidden && loadSys(), 3000);

function viewSys() {
  if (!sys) { $("#main").innerHTML = '<div class="empty">Cargando…</div>'; loadSys(); return; }
  const ram = sys.memTotal ? (sys.memUsed / sys.memTotal) * 100 : 0;
  const gb = (b) => `${(b / 1024 ** 3).toFixed(1)} GB`;
  const mbps = (v) => (v >= 1e6 ? `${(v / 1e6).toFixed(1)} Mb/s` : `${Math.round(v / 1e3)} kb/s`);
  const col = (p) => (p >= 85 ? "var(--live)" : p >= 65 ? "var(--warn)" : "var(--ok)");
  const bar = (p) => `<span class="bar"><i style="width:${Math.min(100, p)}%;background:${col(p)}"></i></span>`;
  const ap = (S && S.app) || {};
  const updLine = ap.busy ? esc(ap.busy) : ap.error ? `<span style="color:#ff8b8e">${esc(ap.error)}</span>` : ap.available ? `Hay una versión nueva: <b style="color:var(--ok)">${esc(ap.latest)}</b>` : ap.latest ? "Está al día" : "";
  $("#main").innerHTML = `<div class="card">
    <div class="line"><span>OmniCaster</span><b>${esc(ap.version || "—")}</b></div>
    ${updLine ? `<div class="line"><span>${updLine}</span></div>` : ""}
    <div style="height:6px"></div>
    ${ap.available ? `<button class="btn" data-upd="install" ${ap.busy ? "disabled" : ""} style="background:var(--accent);border-color:var(--accent);color:#fff">Actualizar a ${esc(ap.latest)}</button>`
      : `<button class="btn" data-upd="check" ${ap.busy ? "disabled" : ""}>Buscar actualizaciones</button>`}
  </div>
  <h3>Equipo</h3><div class="card">
    <div class="stat"><span>Procesador</span>${bar(sys.cpu)}<b>${Math.round(sys.cpu)}%</b></div>
    <div class="stat"><span>Memoria</span>${bar(ram)}<b>${gb(sys.memUsed)}</b></div>
    <div class="stat"><span>Motor de audio</span>${bar(sys.audioLoad)}<b>${sys.audioLoad.toFixed(1)}%</b></div></div>
    <h3>Red</h3><div class="card">${(sys.nets || []).slice(0, 4).map((n) => `<div class="line"><span>${esc(n.name)}</span><b>↓${mbps(n.rxBps)} ↑${mbps(n.txBps)}</b></div>`).join("") || '<div class="line">Sin tráfico</div>'}</div>
    <h3>OmniCaster</h3><div class="card">${(sys.procs || []).map((p) => `<div class="line"><span>${esc(p.name)}</span><b>${p.cpu.toFixed(1)}% · ${Math.round(p.mem / 1024 ** 2)} MB</b></div>`).join("")}
    ${sys.diskTotal ? `<div class="line"><span>Disco libre</span><b>${gb(sys.diskFree)}</b></div>` : ""}</div>
  <div class="sec"><h3>Servidores de streaming</h3><button class="btn" data-srv-new="1">+ Nuevo</button></div>
  ${(S.icecast || []).length ? (S.icecast || []).map((x) => `<div class="item srv" data-srv="${esc(x.id)}">
      <div class="t"><b>${esc(x.name || "Sin nombre")}</b><small>${esc(x.host || "")} · ${esc(String(x.port || ""))}${esc(x.mount || "")}</small></div>
      <button class="sw ${x.enabled ? "on" : ""}" data-srvsw="${esc(x.id)}" aria-label="Activar"></button></div>`).join("")
    : '<div class="empty">Sin servidores de streaming</div>'}`;
  $("#main").onclick = (e) => {
    const u = e.target.closest("[data-upd]")?.dataset.upd;
    if (u === "check") return cmd({ cmd: "updCheck" });
    if (u === "install" && confirm("OmniCaster se cerrará y se volverá a abrir para actualizarse: la emisión se cortará unos segundos. ¿Seguir?")) return cmd({ cmd: "updInstall" });
    if (e.target.closest("[data-srv-new]")) return openSrv(null);
    const sw = e.target.closest("[data-srvsw]");
    if (sw) {
      const x = (S.icecast || []).find((i) => i.id === sw.dataset.srvsw);
      if (x) cmd({ cmd: "streamsUpdate", streams: (S.icecast || []).map((i) => (i.id === x.id ? { ...i, enabled: !i.enabled } : i)) });
      sw.classList.toggle("on");
      return;
    }
    const it = e.target.closest(".item[data-srv]");
    if (it) openSrv(it.dataset.srv);
  };
}

/* Editor de un servidor Icecast (mobile) */
function openSrv(id) {
  const cur = (S.icecast || []).find((i) => i.id === id);
  const d = cur ? { ...cur } : { id: "", name: "", enabled: false, host: "localhost", port: 8000, mount: "/miradio.flac", username: "source", password: "", tls: false, codec: "flac", bitrateKbps: 128, stationName: S.station || "", description: "", genre: "" };
  editing = { kind: "__srv", id, d: JSON.parse(JSON.stringify(d)) };
  dragging = true;
  const el = document.createElement("div");
  el.id = "ed"; el.className = "ed";
  el.innerHTML = `<h4>Servidor ${id ? "" : "nuevo"}</h4>
    <label>Nombre</label><input type="text" data-f="name" value="${esc(d.name)}">
    <label>Servidor</label><input type="text" data-f="host" value="${esc(d.host)}">
    <div class="row2"><div style="flex:1"><label>Puerto</label><input type="number" data-f="port" value="${d.port || 8000}"></div>
      <label style="display:flex;align-items:center;gap:6px;align-self:end"><input type="checkbox" data-f="tls" ${d.tls ? "checked" : ""}> TLS</label></div>
    <label>Montaje</label><input type="text" data-f="mount" value="${esc(d.mount)}">
    <div class="row2"><div style="flex:1"><label>Usuario</label><input type="text" data-f="username" value="${esc(d.username)}"></div>
      <div style="flex:1"><label>Contraseña</label><input type="password" data-f="password" value="${esc(d.password)}"></div></div>
    <label>Formato</label><select data-f="codec">
      <option value="flac" ${d.codec === "flac" ? "selected" : ""}>FLAC</option>
      <option value="aac" ${d.codec === "aac" ? "selected" : ""}>AAC</option></select>
    ${d.codec === "aac" ? `<label>Bitrate (kbps)</label><input type="number" min="32" max="512" data-f="bitrateKbps" value="${d.bitrateKbps || 128}">` : ""}
    <label>Nombre de la emisora</label><input type="text" data-f="stationName" value="${esc(d.stationName || "")}">
    <label>Descripción</label><input type="text" data-f="description" value="${esc(d.description || "")}">
    <div class="row2"><label style="display:flex;align-items:center;gap:6px"><input type="checkbox" data-f="public" ${d.public ? "checked" : ""}> En la lista pública del servidor</label>
      <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" data-f="enabled" ${d.enabled ? "checked" : ""}> Encendido</label></div>
    <div style="height:12px"></div>
    <button class="btn" data-svsave="1" style="background:var(--accent);border-color:var(--accent);color:#fff">Guardar</button>
    ${id ? '<button class="btn" data-svdel="1" style="color:#ff8b8e">Quitar</button>' : ""}
    <button class="btn" data-close="1">Cancelar</button>`;
  el.oninput = (e) => {
    const f = e.target.dataset.f;
    if (!f) return;
    editing.d[f] = e.target.type === "checkbox" ? e.target.checked : e.target.type === "number" ? Number(e.target.value) : e.target.value;
    if (f === "codec") el.oninput; // re-render sencillo: se reemplaza el bloque de bitrate
  };
  el.onclick = (e) => {
    const t = e.target.closest("button");
    if (!t) return;
    const close = () => { el.remove(); editing = null; dragging = false; };
    if (t.dataset.close) return close();
    if (t.dataset.svsave) {
      const d = editing.d;
      cmd({ cmd: "streamsUpdate", streams: (S.icecast || []).filter((i) => i.id !== id).concat([{ ...d, id: d.id || `st${Date.now().toString(36)}`, name: String(d.name || "").trim() || "Icecast" }]) });
      toast("Guardado (reaplica en EMITIR para que entre)");
      return close();
    }
    if (t.dataset.svdel) {
      if (confirm("¿Quitar este servidor?")) {
        cmd({ cmd: "streamsUpdate", streams: (S.icecast || []).filter((i) => i.id !== id) });
        close();
      }
      return;
    }
  };
  document.body.appendChild(el);
}

// La barra de progreso avanza sola entre mensajes.
setInterval(() => {
  if (tab !== "live" || !S?.now?.playing) return;
  const p = $("#prog"), c = $("#cur");
  if (!p || !c) return;
  const pos = S.now.pos + (Date.now() - gotAt) / 1000;
  p.style.width = `${S.now.dur > 0 ? Math.min(100, (pos / S.now.dur) * 100) : 0}%`;
  c.textContent = fmt(pos);
}, 500);

document.addEventListener("visibilitychange", () => { if (!document.hidden && token && (!es || es.readyState === 2)) connect(); });

if (token) start(); else showLogin();
</script>
